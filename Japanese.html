<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Japanese Flashcards · A2 · Audio + Romaji</title>
<style>
  :root{
    --ink:#151726;
    --muted:#7b8098;
    --accent:#bc002d;
    --line:#eceef6;
  }

  *{box-sizing:border-box;margin:0;padding:0}

  body{
    font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
    color:var(--ink);
    min-height:100vh;
    display:flex;
    justify-content:center;
    padding:40px 20px 70px;
    background:
      radial-gradient(900px 520px at 8% -12%, #ffe1e4 0%, transparent 62%),
      radial-gradient(820px 520px at 102% -4%, #f0f0f5 0%, transparent 58%),
      radial-gradient(760px 520px at 50% 118%, #ffe9ec 0%, transparent 62%),
      #f7f8fc;
    background-attachment:fixed;
  }

  .app{width:100%;max-width:520px}

  .brand{display:flex;align-items:center;gap:14px;margin-bottom:22px;padding-left:4px}
  .logo{
    width:52px;height:52px;border-radius:18px;flex:none;
    display:grid;place-items:center;
    font-size:22px;font-weight:700;color:#fff;letter-spacing:.02em;
    background:linear-gradient(180deg,#ffffff 0%,#ffffff 100%);
    border:2px solid #bc002d;
    box-shadow:0 12px 26px -10px rgba(188,0,45,.55);
  }
  .logo-inner{
    width:34px;height:34px;border-radius:50%;
    background:linear-gradient(135deg,#bc002d,#e2264d);
    display:grid;place-items:center;
    color:#fff;font-size:17px;font-weight:800;
    box-shadow:inset 0 -2px 6px rgba(0,0,0,.15);
  }
  h1{font-size:19px;font-weight:700;letter-spacing:-.015em}
  .subtitle{font-size:13px;color:var(--muted);margin-top:3px}
  .subtitle b{color:var(--accent);font-weight:700}

  .tabs{
    position:relative;display:grid;grid-template-columns:1fr 1fr;
    background:#e8ebf4;border-radius:999px;padding:4px;margin-bottom:18px;
    user-select:none;
  }
  .tab{
    position:relative;z-index:1;border:0;background:none;cursor:pointer;
    font:inherit;font-size:14px;font-weight:650;color:var(--muted);
    padding:12px 8px;border-radius:999px;
    display:flex;align-items:center;justify-content:center;gap:7px;
    transition:color .25s;
  }
  .tab.active{color:var(--ink)}
  .indicator{
    position:absolute;top:4px;left:4px;
    width:calc(50% - 4px);height:calc(100% - 8px);
    background:#fff;border-radius:999px;
    box-shadow:0 4px 14px -3px rgba(30,35,80,.18);
    transition:transform .35s cubic-bezier(.2,.8,.3,1);
  }
  .badge{
    min-width:20px;height:20px;padding:0 6px;border-radius:999px;
    background:var(--accent);color:#fff;font-size:11px;font-weight:700;
    display:inline-grid;place-items:center;
  }
  .badge.pop{animation:badgePop .45s ease}

  .panel{animation:popIn .45s cubic-bezier(.2,.8,.3,1) both}
  .hidden{display:none !important}

  .modeswitch{display:flex;gap:9px;margin-bottom:12px;padding:0 2px}
  .mode-chip{
    flex:1;border:1px solid var(--line);cursor:pointer;font:inherit;
    background:rgba(255,255,255,.72);
    border-radius:16px;padding:12px 8px;
    font-size:13.5px;font-weight:650;color:var(--muted);
    display:flex;align-items:center;justify-content:center;gap:7px;
    transition:all .25s;
  }
  .mode-chip .n{
    font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:999px;
    background:#eef0f7;color:#98a0b8;transition:all .25s;
  }
  .mode-chip:hover{border-color:#dfe3f0}
  .mode-chip:active{transform:scale(.98)}
  .mode-chip.active{
    background:linear-gradient(135deg,#1d2033,#3b4168);
    color:#fff;border-color:transparent;
    box-shadow:0 14px 24px -14px rgba(29,32,51,.95);
  }
  .mode-chip.active .n{background:rgba(255,255,255,.22);color:#fff}

  .catbar{
    display:flex;gap:7px;overflow-x:auto;
    padding:2px 20px 14px;margin:0 -20px;
    scrollbar-width:none;-ms-overflow-style:none;
  }
  .catbar::-webkit-scrollbar{display:none}
  .cat{
    flex:none;border:1px solid var(--line);background:rgba(255,255,255,.72);
    border-radius:999px;padding:8px 13px;cursor:pointer;
    font:inherit;font-size:12.5px;font-weight:650;color:var(--muted);
    display:flex;align-items:center;gap:6px;white-space:nowrap;
    transition:all .22s;
  }
  .cat:hover{border-color:#dfe3f0;color:var(--ink)}
  .cat .catn{
    font-size:10.5px;font-weight:700;padding:1px 6px;border-radius:999px;
    background:#eef0f7;color:#98a0b8;transition:all .22s;
  }
  .cat.active{
    background:var(--cat,var(--ink));color:#fff;border-color:transparent;
    box-shadow:0 10px 20px -12px var(--cat,rgba(29,32,51,.9));
  }
  .cat.active .catn{background:rgba(255,255,255,.25);color:#fff}

  .card{
    position:relative;overflow:hidden;
    background:rgba(255,255,255,.88);
    backdrop-filter:blur(14px);
    -webkit-backdrop-filter:blur(14px);
    border:1px solid rgba(255,255,255,.95);
    border-radius:30px;
    padding:18px 24px 26px;
    box-shadow:0 34px 64px -28px rgba(35,40,90,.30), 0 2px 6px rgba(35,40,90,.04);
  }
  .card-top{
    display:flex;justify-content:space-between;align-items:center;
    gap:8px;margin-bottom:6px;min-height:26px;flex-wrap:wrap;
  }
  .posbadge{
    font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
    padding:5px 10px;border-radius:999px;
    color:#fff;background:var(--cat,var(--muted));
    box-shadow:0 8px 16px -10px var(--cat,rgba(0,0,0,.4));
    white-space:nowrap;
  }
  .posbadge .ja{
    font-weight:600;
    opacity:.85;margin-left:5px;letter-spacing:0;
    text-transform:none;font-size:11px;
  }
  .top-right{display:flex;align-items:center;gap:6px;flex:none}

  .auto-chip{
    border:1px solid var(--line);background:rgba(255,255,255,.72);
    border-radius:999px;padding:5px 9px;cursor:pointer;
    font:inherit;font-size:10.5px;font-weight:700;color:#98a0b8;
    letter-spacing:.03em;
    display:flex;align-items:center;gap:5px;
    transition:all .22s;
    white-space:nowrap;
  }
  .auto-chip:hover{border-color:#dfe3f0;color:var(--ink)}
  .auto-chip .dot{
    width:7px;height:7px;border-radius:50%;background:#cbd0e0;
    transition:background .22s,box-shadow .22s;
  }
  .auto-chip.on{
    background:linear-gradient(135deg,#e8fff4,#f0fff9);
    border-color:#b8f0d8;color:#059669;
  }
  .auto-chip.on .dot{
    background:#10b981;
    box-shadow:0 0 0 3px rgba(16,185,129,.22);
  }
  .auto-chip.romaji.on{
    background:linear-gradient(135deg,#eef2ff,#f5f7ff);
    border-color:#c7d2fe;color:#4f46e5;
  }
  .auto-chip.romaji.on .dot{
    background:#6366f1;
    box-shadow:0 0 0 3px rgba(99,102,241,.22);
  }
  .auto-chip.romaji .sym{font-weight:800;font-size:12px;line-height:1}

  .counter{
    font-size:11px;font-weight:700;letter-spacing:.14em;
    text-transform:uppercase;color:#b3b9cd;
    white-space:nowrap;
  }

  .word{
    min-height:250px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;padding:6px 0 4px;
  }
  .hanzi{
    font-family:"Hiragino Sans","Yu Gothic","Meiryo","Noto Sans JP",sans-serif;
    font-weight:600;line-height:1.25;letter-spacing:.02em;
    word-break:break-word;
    cursor:pointer;
    transition:transform .18s, color .18s;
    user-select:none;
    -webkit-tap-highlight-color:transparent;
  }
  .hanzi:hover{color:var(--accent);transform:scale(1.03)}
  .hanzi:active{transform:scale(.97)}
  .hanzi.size-l{font-size:clamp(54px,16vw,80px)}
  .hanzi.size-m{font-size:clamp(34px,10vw,50px)}
  .hanzi.size-s{font-size:clamp(22px,6.4vw,30px);line-height:1.4}

  .pinyin{
    margin-top:14px;
    font-size:clamp(14px,4.1vw,18px);font-weight:650;letter-spacing:.02em;
    color:var(--accent);word-break:break-word;line-height:1.45;
  }

  .latin{
    margin-top:8px;
    display:inline-flex;align-items:center;gap:7px;
    padding:5px 13px;border-radius:999px;
    background:#f3f4ff;border:1px solid #e4e7ff;
    font-size:clamp(12px,3.4vw,14px);font-weight:600;
    color:#5b62a8;letter-spacing:.04em;
    max-width:100%;
    word-break:break-word;
  }
  .latin .sym{
    font-size:12px;color:#8a91d4;flex:none;font-weight:700;
  }
  .latin.hide{display:none}

  .english{
    margin-top:16px;font-size:clamp(14px,4vw,16.5px);
    color:var(--muted);font-weight:500;line-height:1.5;
  }
  .english::before{
    content:"";display:block;width:26px;height:2px;border-radius:2px;
    background:var(--line);margin:0 auto 16px;
  }

  .speak-btn{
    position:absolute;bottom:16px;right:16px;
    width:46px;height:46px;border-radius:50%;
    border:0;cursor:pointer;color:#fff;font-size:19px;
    background:linear-gradient(135deg,#1d2033,#3b4168);
    display:grid;place-items:center;
    box-shadow:0 14px 26px -12px rgba(29,32,51,.95);
    transition:transform .15s, box-shadow .25s, background .25s;
    -webkit-tap-highlight-color:transparent;
  }
  .speak-btn:hover{transform:scale(1.06)}
  .speak-btn:active{transform:scale(.94)}
  .speak-btn.speaking{
    background:linear-gradient(135deg,#bc002d,#e2264d);
    animation:speakPulse 1s ease-in-out infinite;
  }
  @keyframes speakPulse{
    0%,100%{box-shadow:0 14px 26px -12px rgba(188,0,45,.95), 0 0 0 0 rgba(188,0,45,.55)}
    50%    {box-shadow:0 14px 26px -12px rgba(188,0,45,.95), 0 0 0 14px rgba(188,0,45,0)}
  }

  .actions{display:grid;grid-template-columns:58px 1fr 1.25fr;gap:10px;margin-top:16px}
  .btn{
    border:0;font:inherit;font-size:15px;font-weight:650;
    padding:17px 10px;border-radius:18px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;gap:8px;
    transition:transform .15s, box-shadow .25s, background .25s, color .25s, border-color .25s;
  }
  .btn:active{transform:scale(.97)}
  .btn .ico{font-size:17px;line-height:1}
  .btn.primary{
    background:linear-gradient(135deg,#1d2033,#363b60);
    color:#fff;
    box-shadow:0 16px 30px -14px rgba(29,32,51,.95);
  }
  .btn.primary:hover{box-shadow:0 20px 34px -14px rgba(29,32,51,.95)}
  .btn.ghost{
    background:#fff;color:var(--ink);
    border:1.5px solid var(--line);
    box-shadow:0 6px 16px -10px rgba(35,40,90,.35);
  }
  .btn.ghost:hover{border-color:#dde1ee}
  .btn.ghost.saved{
    background:linear-gradient(135deg,#ffe9ec,#fff3f5);
    border-color:#ffd2d2;color:var(--accent);
  }
  .btn.prev{
    background:#fff;border:1.5px solid var(--line);color:var(--muted);
    font-size:18px;padding:17px 0;
    box-shadow:0 6px 16px -10px rgba(35,40,90,.35);
  }
  .btn.prev:hover{color:var(--ink);border-color:#dde1ee}

  .saved-head{
    display:flex;align-items:baseline;justify-content:space-between;
    margin-bottom:12px;padding:0 6px;
  }
  .saved-head h2{font-size:15px;font-weight:700}
  .saved-head .meta{font-size:13px;color:var(--muted);font-weight:600}

  .filters{display:flex;gap:7px;margin-bottom:14px;padding:0 2px;flex-wrap:wrap}
  .filter{
    border:1px solid var(--line);background:rgba(255,255,255,.72);
    border-radius:999px;padding:8px 14px;cursor:pointer;
    font:inherit;font-size:12.5px;font-weight:650;color:var(--muted);
    transition:all .22s;
  }
  .filter:hover{border-color:#dfe3f0}
  .filter.active{
    background:var(--ink);color:#fff;border-color:transparent;
    box-shadow:0 10px 20px -12px rgba(29,32,51,.9);
  }

  .saved-list{display:flex;flex-direction:column;gap:10px}

  .saved-item{
    display:flex;align-items:center;gap:12px;cursor:pointer;
    background:rgba(255,255,255,.88);
    backdrop-filter:blur(10px);
    border:1px solid rgba(255,255,255,.95);
    border-radius:20px;padding:12px 14px;
    box-shadow:0 12px 26px -20px rgba(35,40,90,.75);
    animation:slideIn .4s cubic-bezier(.2,.8,.3,1) both;
    transition:transform .18s, box-shadow .25s;
  }
  .saved-item:hover{transform:translateY(-2px);box-shadow:0 18px 32px -20px rgba(35,40,90,.8)}
  .si-hanzi{
    font-family:"Hiragino Sans","Yu Gothic","Meiryo","Noto Sans JP",sans-serif;
    font-weight:600;font-size:18px;line-height:1.25;
    min-width:58px;max-width:110px;text-align:center;
  }
  .si-hanzi.long{font-size:13px;max-width:118px}
  .si-info{flex:1;min-width:0}
  .si-line{display:flex;align-items:center;gap:6px;margin-bottom:3px;min-width:0}
  .si-cat{
    font-size:9.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;
    padding:2px 7px;border-radius:6px;color:#fff;background:var(--cat,var(--muted));
    white-space:nowrap;flex:none;
  }
  .si-pinyin{
    font-size:12px;font-weight:700;color:var(--accent);letter-spacing:.02em;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .si-latin{
    font-size:11px;font-weight:600;color:#7c84c9;letter-spacing:.03em;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    margin-top:2px;
  }
  .si-english{
    font-size:13px;color:var(--muted);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    margin-top:2px;
  }
  .si-speak{
    flex:none;width:32px;height:32px;border:0;border-radius:12px;cursor:pointer;
    background:#f2f4fa;color:#6b7290;font-size:14px;
    display:grid;place-items:center;
    transition:background .2s,color .2s,transform .15s;
  }
  .si-speak:hover{background:#e8ebff;color:#3b4168}
  .si-speak:active{transform:scale(.9)}
  .si-speak.speaking{background:#ffe8e8;color:var(--accent)}
  .remove{
    flex:none;width:32px;height:32px;border:0;border-radius:12px;cursor:pointer;
    background:#f2f4fa;color:#9aa0b8;font-size:13px;
    display:grid;place-items:center;
    transition:background .2s,color .2s,transform .15s;
  }
  .remove:hover{background:#ffe8e8;color:var(--accent)}
  .remove:active{transform:scale(.9)}

  .clear-btn{
    margin-top:6px;border:0;background:transparent;cursor:pointer;
    font:inherit;font-size:13px;font-weight:650;color:#9aa0b8;
    padding:14px;border-radius:16px;
    transition:background .2s,color .2s;
  }
  .clear-btn:hover{background:#ffe8e8;color:var(--accent)}

  .empty{text-align:center;padding:54px 20px;color:var(--muted)}
  .empty .icon{font-size:42px;margin-bottom:14px}
  .empty p{font-size:15px;font-weight:700;color:var(--ink);margin-bottom:7px}
  .empty span{font-size:13.5px;line-height:1.55;display:block;max-width:260px;margin:0 auto}

  @keyframes popIn{
    from{opacity:0;transform:translateY(16px) scale(.97)}
    to{opacity:1;transform:none}
  }
  @keyframes slideIn{
    from{opacity:0;transform:translateY(12px)}
    to{opacity:1;transform:none}
  }
  @keyframes badgePop{
    0%{transform:scale(1)}
    45%{transform:scale(1.4)}
    100%{transform:scale(1)}
  }

  .audio-warn{
    display:none;margin-top:12px;padding:11px 14px;border-radius:14px;
    background:#fff7ed;border:1px solid #fed7aa;
    font-size:12px;color:#9a3412;line-height:1.5;
  }
  .audio-warn.show{display:block}

  @media (max-width:400px){
    body{padding:26px 14px 50px}
    .card{padding:16px 18px 22px;border-radius:26px}
    .word{min-height:215px}
    .actions{grid-template-columns:52px 1fr 1.2fr;gap:8px}
    .btn{font-size:14px;padding:16px 8px}
    .speak-btn{width:42px;height:42px;font-size:17px;bottom:14px;right:14px}
    .auto-chip{padding:4px 7px;font-size:10px}
  }
</style>
</head>
<body>

<div class="app">
  <header class="brand">
    <div class="logo"><div class="logo-inner">日</div></div>
    <div>
      <h1>Japanese Flashcards · A2</h1>
      <p class="subtitle"><b id="totalCount">0</b> words · 100 phrases · audio + romaji</p>
    </div>
  </header>

  <nav class="tabs">
    <span class="indicator" id="indicator"></span>
    <button class="tab active" data-tab="learn">Learn</button>
    <button class="tab" data-tab="saved">My list <span class="badge" id="badge">0</span></button>
  </nav>

  <section class="panel" id="panel-learn">

    <div class="modeswitch">
      <button class="mode-chip active" data-mode="words">
        Words <span class="n" id="nWords">0</span>
      </button>
      <button class="mode-chip" data-mode="expressions">
        Expressions <span class="n" id="nExpr">0</span>
      </button>
    </div>

    <div class="catbar" id="catbar"></div>

    <div class="card" id="card">
      <div class="card-top">
        <span class="posbadge" id="posbadge"></span>
        <div class="top-right">
          <button class="auto-chip" id="autoChip" title="Toggle auto-play">
            <span class="dot"></span>Auto
          </button>
          <button class="auto-chip romaji" id="romajiChip" title="Toggle romaji">
            <span class="dot"></span><span class="sym">≈</span>Romaji
          </button>
          <span class="counter" id="counter">1 / 1</span>
        </div>
      </div>
      <div class="word" id="word">
        <div class="hanzi size-l" id="hanzi" title="Click to hear">こんにちは</div>
        <div class="pinyin" id="pinyin">konnichiwa</div>
        <div class="latin" id="latin"><span class="sym">≈</span><span id="latinText">kohn-nee-chee-wah</span></div>
        <div class="english" id="english">hello</div>
      </div>
      <button class="speak-btn" id="speakBtn" title="Listen (Space)">🔊</button>
    </div>

    <div class="audio-warn" id="audioWarn">
      ⚠️ No Japanese voice detected yet. If audio is silent, make sure a Japanese voice is installed in your Android text-to-speech settings, then reload this page.
    </div>

    <div class="actions">
      <button class="btn prev" id="prevBtn" title="Previous (←)">←</button>
      <button class="btn ghost" id="saveBtn" title="Save (S)">
        <span class="ico">♡</span>Save
      </button>
      <button class="btn primary" id="nextBtn" title="Next (→)">Next →</button>
    </div>
  </section>

  <section class="panel hidden" id="panel-saved">
    <div class="saved-head">
      <h2>My list</h2>
      <span class="meta" id="savedMeta">0 saved</span>
    </div>

    <div class="filters" id="filters">
      <button class="filter active" data-filter="all">All</button>
      <button class="filter" data-filter="words">Words</button>
      <button class="filter" data-filter="expressions">Expressions</button>
    </div>

    <div class="saved-list" id="savedList"></div>
  </section>
</div>

<script>
/* =====================================================================
   CATEGORY META
   ===================================================================== */

const CATS = {
  pronoun:      { label:'Pronoun',      ja:'代名詞',    color:'#6366f1' },
  demonstrative:{ label:'Demonstrative',ja:'指示詞',    color:'#8b5cf6' },
  number:       { label:'Number',       ja:'数詞',      color:'#a855f7' },
  counter:      { label:'Counter',      ja:'助数詞',    color:'#d946ef' },
  time:         { label:'Time word',    ja:'時の言葉',  color:'#ec4899' },
  question:     { label:'Question word',ja:'疑問詞',    color:'#f43f5e' },
  noun:         { label:'Noun',         ja:'名詞',      color:'#0ea5e9' },
  verb:         { label:'Verb',         ja:'動詞',      color:'#ef4444' },
  adjective:    { label:'I-adjective',  ja:'い形容詞',  color:'#f97316' },
  na_adjective: { label:'Na-adjective', ja:'な形容詞',  color:'#fb923c' },
  adverb:       { label:'Adverb',       ja:'副詞',      color:'#eab308' },
  particle:     { label:'Particle',     ja:'助詞',      color:'#22c55e' },
  conjunction:  { label:'Conjunction',  ja:'接続詞',    color:'#14b8a6' },

  greeting:     { label:'Greeting',     ja:'挨拶',      color:'#10b981' },
  intro:        { label:'Introduce',    ja:'自己紹介',  color:'#3b82f6' },
  language:     { label:'Language',     ja:'言葉',      color:'#6366f1' },
  daily:        { label:'Daily life',   ja:'日常',      color:'#f59e0b' },

/* =====================================================================
   ROMAJI → ENGLISH-FRIENDLY RESPELLING
   ===================================================================== */

function splitSyllables(w){
  const out = [];
  let i = 0;
  w = w.toLowerCase();
  while (i < w.length){
    // consonant + y + vowel (kya, nyu, etc.)
    if (i+2 < w.length && /[kgnmhrbpy]/.test(w[i]) && w[i+1]==='y' && /[aiueo]/.test(w[i+2])){
      out.push(w.substr(i,3)); i += 3; continue;
    }
    // sh/ch + vowel
    if (i+2 < w.length && /[sc]/.test(w[i]) && w[i+1]==='h' && /[aiueo]/.test(w[i+2])){
      out.push(w.substr(i,3)); i += 3; continue;
    }
    // doubled consonant (small tsu): double letter + vowel
    if (i+2 < w.length && w[i] === w[i+1] && /[kstpgzdh]/.test(w[i]) && /[aiueo]/.test(w[i+2])){
      out.push(w[i] + w.substr(i+1,2)); i += 3; continue;
    }
    // consonant + vowel
    if (i+1 < w.length && /[kstnmhrbpdgz]/.test(w[i]) && /[aiueo]/.test(w[i+1])){
      out.push(w.substr(i,2)); i += 2; continue;
    }
    // lone vowel or n
    out.push(w[i]); i++;
  }
  return out;
}

function respellSyll(s){
  return s
    .replace(/a/g, 'ah').replace(/i/g, 'ee').replace(/u/g, 'oo')
    .replace(/e/g, 'eh').replace(/o/g, 'oh')
    .replace(/n$/, 'n');
}

function toRomajiRespell(romaji){
  if (!romaji) return '';
  // Pre-process long vowels before splitting
  const clean = romaji
    .toLowerCase()
    .replace(/ou/g, 'oo')      // おう → long o
    .replace(/uu/g, 'uu')      // うう → long u
    .replace(/ei/g, 'ee')      // えい → long e
    .replace(/[^a-z\s]/g, ' ')
    .replace(/\s+/g, ' ')
    .trim();
  if (!clean) return '';
  return clean.split(' ').map(word => {
    const sylls = splitSyllables(word);
    return sylls.map((s, i) => {
      const r = respellSyll(s);
      return i === 0 ? r.toUpperCase() : r;
    }).join('-');
  }).join(' ');
}

/* =====================================================================
   TEXT-TO-SPEECH MODULE — ANDROID SAFE
   ===================================================================== */

const TTS = (() => {
  const supported = 'speechSynthesis' in window;
  const LANG = 'ja-JP';
  let targetVoice = null;
  let voicesReady = false;
  let autoPlay = false;

  try { autoPlay = localStorage.getItem('ja-flashcards-autoplay') === '1'; } catch(e){}

  /* Keep retrying until Android gives us the voice list (can take 5+ seconds) */
  function loadVoices(){
    if (!supported) return;
    const voices = speechSynthesis.getVoices();
    if (!voices.length){
      setTimeout(loadVoices, 250);
      return;
    }
    const prefix = LANG.split('-')[0];
    targetVoice =
      voices.find(v => v.lang === LANG) ||
      voices.find(v => v.lang.replace('_','-').startsWith(LANG)) ||
      voices.find(v => v.lang.toLowerCase().startsWith(prefix)) ||
      null;
    voicesReady = true;
    updateWarn();
  }

  function updateWarn(){
    const warn = document.getElementById('audioWarn');
    if (!warn) return;
    if (!supported || !targetVoice) warn.classList.add('show');
    else warn.classList.remove('show');
  }

  if (supported){
    speechSynthesis.addEventListener('voiceschanged', loadVoices);
    loadVoices();
  }

  function clean(text){
    return text
      .replace(/[「」『』（）【】…—\s]/g, '')
      .replace(/[?.,!;:'"()\-]/g, '')
      .trim();
  }

  function speak(text, btnEl){
    if (!supported) return;

    /* If voices aren't loaded yet, wait for them, then try again */
    if (!voicesReady){
      loadVoices();
      setTimeout(() => speak(text, btnEl), 400);
      return;
    }

    const clean_text = clean(text);
    if (!clean_text) return;

    /* Android/iOS bug: cancel() right before speak() kills playback.
       Only cancel if something is actually playing. */
    if (speechSynthesis.speaking){
      speechSynthesis.cancel();
    }

    const u = new SpeechSynthesisUtterance(clean_text);
    u.lang  = LANG;
    u.rate  = 0.85;
    u.pitch = 1;
    if (targetVoice) {
      try { u.voice = targetVoice; } catch(e){}
    }

    const targets = [];
    if (btnEl) targets.push(btnEl);
    const mainBtn = document.getElementById('speakBtn');
    if (mainBtn && btnEl !== mainBtn && !document.getElementById('panel-learn').classList.contains('hidden')) {
      const cur = currentItem();
      if (cur && cur.h === text) targets.push(mainBtn);
    }

    const setOn  = () => targets.forEach(t => t.classList.add('speaking'));
    const setOff = () => targets.forEach(t => t.classList.remove('speaking'));

    u.onstart = setOn;
    u.onend   = setOff;
    u.onerror = setOff;
    setTimeout(setOn, 80);

    speechSynthesis.speak(u);

    /* Safety: if onend never fires (Android bug), clear the button state */
    const maxMs = 2500 + clean_text.length * 300;
    setTimeout(() => { if (!speechSynthesis.speaking) setOff(); }, maxMs);
  }

  function stop(){
    if (!supported) return;
    speechSynthesis.cancel();
    document.querySelectorAll('.speaking').forEach(el => el.classList.remove('speaking'));
  }

  function setAuto(on){
    autoPlay = on;
    try { localStorage.setItem('ja-flashcards-autoplay', on ? '1' : '0'); } catch(e){}
    const chip = document.getElementById('autoChip');
    if (chip) chip.classList.toggle('on', on);
  }

  function isAuto(){ return autoPlay; }

  return { speak, stop, setAuto, isAuto, supported };
})();

const el  = id => document.getElementById(id);
const KEY = 'ja-flashcards-learned-v1';
const ROMAJI_KEY = 'ja-flashcards-romaji-v1';

let mode        = 'words';
let catFilter   = 'all';
let poolIdx     = { words: 0, expressions: 0 };
let savedFilter = 'all';
let showRomaji  = true;

try {
  const v = localStorage.getItem(ROMAJI_KEY);
  if (v === '0') showRomaji = false;
} catch(e){}

const keyOf    = (m, h) => m + '::' + h;
const splitKey = k => { const i = k.indexOf('::'); return { mode: k.slice(0,i), h: k.slice(i+2) }; };

let learned = [];
try {
  const raw = JSON.parse(localStorage.getItem(KEY));
  if (Array.isArray(raw)) learned = raw.filter(k => typeof k === 'string');
} catch(e) { learned = []; }

learned = learned.filter(k => {
  const { mode:m, h } = splitKey(k);
  return DATA[m] && DATA[m].some(w => w.h === h);
});

const persist = () => { try { localStorage.setItem(KEY, JSON.stringify(learned)); } catch(e){} };

/* =====================================================================
   LEARN PANEL
   ===================================================================== */

function getPool(){
  const base = DATA[mode];
  if (catFilter === 'all') return base;
  return base.filter(w => w.cat === catFilter);
}

function currentItem(){
  const pool = getPool();
  return pool[poolIdx[mode] % pool.length];
}

function animateWord(){
  const w = el('word');
  w.style.animation = 'none';
  void w.offsetWidth;
  w.style.animation = 'popIn .45s cubic-bezier(.2,.8,.3,1)';
}

function sizeClassFor(text){
  const len = [...text].length;
  if (len <= 4)  return 'size-l';
  if (len <= 8)  return 'size-m';
  return 'size-s';
}

function syncSaveBtn(){
  const saved = learned.includes(keyOf(mode, currentItem().h));
  const b = el('saveBtn');
  b.classList.toggle('saved', saved);
  b.innerHTML = saved ? '<span class="ico">♥</span>Saved'
                      : '<span class="ico">♡</span>Save';
}

function syncRomajiChip(){
  el('romajiChip').classList.toggle('on', showRomaji);
  el('pinyin').style.display = showRomaji ? '' : 'none';
  el('latin').classList.toggle('hide', !showRomaji);
}

function renderCard(animate = true){
  const pool = getPool();
  const i    = poolIdx[mode] % pool.length;
  const w    = pool[i];
  const meta = CATS[w.cat] || { label:w.cat, ja:'', color:'#7b8098' };

  const badge = el('posbadge');
  badge.style.setProperty('--cat', meta.color || '#7b8098');
  badge.innerHTML = `${meta.label}${meta.ja ? `<span class="ja">${meta.ja}</span>` : ''}`;

  const hz = el('hanzi');
  hz.textContent = w.h;
  hz.className   = 'hanzi ' + sizeClassFor(w.h);

  el('pinyin').textContent    = w.p;
  el('latinText').textContent = toRomajiRespell(w.p);
  el('english').textContent   = w.e;
  el('counter').textContent   = (i + 1) + ' / ' + pool.length;

  syncSaveBtn();
  syncRomajiChip();
  if (animate) animateWord();

  TTS.stop();
  if (TTS.isAuto()) {
    setTimeout(() => TTS.speak(w.h, el('speakBtn')), 300);
  }
}

function renderCatBar(){
  const bar   = el('catbar');
  const items = DATA[mode];
  const counts = {};
  items.forEach(w => counts[w.cat] = (counts[w.cat] || 0) + 1);

  const cats = Object.keys(counts).sort(
    (a,b) => CAT_ORDER.indexOf(a) - CAT_ORDER.indexOf(b)
  );

  let html = `<button class="cat${catFilter==='all'?' active':''}" data-cat="all">
    All <span class="catn">${items.length}</span>
  </button>`;

  cats.forEach(c => {
    const meta = CATS[c] || { label:c, color:'#7b8098' };
    html += `<button class="cat${catFilter===c?' active':''}" data-cat="${c}" style="--cat:${meta.color}">
      ${meta.label} <span class="catn">${counts[c]}</span>
    </button>`;
  });

  bar.innerHTML = html;

  bar.querySelectorAll('.cat').forEach(btn => {
    btn.addEventListener('click', () => {
      catFilter = btn.dataset.cat;
      poolIdx[mode] = 0;
      renderCatBar();
      renderCard();
    });
  });
}

function nextWord(){
  const pool = getPool();
  poolIdx[mode] = (poolIdx[mode] + 1) % pool.length;
  renderCard();
}

function prevWord(){
  const pool = getPool();
  poolIdx[mode] = (poolIdx[mode] - 1 + pool.length) % pool.length;
  renderCard();
}

function toggleSave(){
  const k = keyOf(mode, currentItem().h);
  const i = learned.indexOf(k);

  if (i === -1){
    learned.push(k);
    const badge = el('badge');
    badge.classList.remove('pop');
    void badge.offsetWidth;
    badge.classList.add('pop');
  } else {
    learned.splice(i, 1);
  }

  persist();
  syncSaveBtn();
  renderSaved();
}

function setMode(m){
  mode = m;
  catFilter = 'all';
  poolIdx[m] = 0;
  document.querySelectorAll('.mode-chip').forEach(c =>
    c.classList.toggle('active', c.dataset.mode === m)
  );
  renderCatBar();
  renderCard();
}

function renderSaved(){
  const list = el('savedList');

  const entries = learned.slice().reverse().map(k => {
    const { mode:m, h } = splitKey(k);
    const w = (DATA[m] || []).find(x => x.h === h);
    return w ? { ...w, mode:m, key:k } : null;
  }).filter(Boolean);

  const countWords = entries.filter(e => e.mode === 'words').length;
  const countExpr  = entries.filter(e => e.mode === 'expressions').length;

  el('badge').textContent     = entries.length;
  el('savedMeta').textContent = entries.length
    ? `${countWords} words · ${countExpr} phrases`
    : '0 saved';

  const filters = el('filters');
  filters.querySelector('[data-filter="all"]').textContent         = `All ${entries.length}`;
  filters.querySelector('[data-filter="words"]').textContent       = `Words ${countWords}`;
  filters.querySelector('[data-filter="expressions"]').textContent = `Expressions ${countExpr}`;
  filters.querySelectorAll('.filter').forEach(f =>
    f.classList.toggle('active', f.dataset.filter === savedFilter)
  );

  const shown = savedFilter === 'all'
    ? entries
    : entries.filter(e => e.mode === savedFilter);

  if (!shown.length){
    list.innerHTML = `
      <div class="empty">
        <div class="icon">📖</div>
        <p>${entries.length ? 'Nothing here' : 'Your list is empty'}</p>
        <span>${entries.length
          ? 'No saved items match this filter.'
          : 'Tap "Save" on a word or phrase you want to remember, and it will appear here.'}</span>
      </div>`;
    return;
  }

  list.innerHTML = shown.map((w, i) => {
    const meta = CATS[w.cat] || { label:w.cat, color:'#94a3b8' };
    const latin = showRomaji ? `<div class="si-latin">≈ ${toRomajiRespell(w.p)}</div>` : '';
    const pinyin = showRomaji ? `<span class="si-pinyin">${w.p}</span>` : '';
    return `
      <div class="saved-item" data-key="${w.key}" style="animation-delay:${Math.min(i,12)*40}ms">
        <div class="si-hanzi${[...w.h].length > 5 ? ' long' : ''}">${w.h}</div>
        <div class="si-info">
          <div class="si-line">
            <span class="si-cat" style="--cat:${meta.color}">${meta.label}</span>
            ${pinyin}
          </div>
          ${latin}
          <div class="si-english">${w.e}</div>
        </div>
        <button class="si-speak" data-speak="${w.h}" title="Listen">🔊</button>
        <button class="remove" data-remove="${w.key}" title="Remove">✕</button>
      </div>`;
  }).join('')
    + `<button class="clear-btn" id="clearBtn">Remove all ${entries.length} saved items</button>`;

  list.querySelectorAll('.saved-item').forEach(item => {
    item.addEventListener('click', ev => {
      if (ev.target.closest('.remove') || ev.target.closest('.si-speak')) return;
      const { mode:m, h } = splitKey(item.dataset.key);
      const i = DATA[m].findIndex(x => x.h === h);
      if (i < 0) return;
      mode = m;
      catFilter = 'all';
      poolIdx[m] = i;
      document.querySelectorAll('.mode-chip').forEach(c =>
        c.classList.toggle('active', c.dataset.mode === m)
      );
      renderCatBar();
      renderCard();
      switchTab('learn');
    });
  });

  list.querySelectorAll('.si-speak').forEach(btn => {
    btn.addEventListener('click', ev => {
      ev.stopPropagation();
      TTS.speak(btn.dataset.speak, btn);
    });
  });

  list.querySelectorAll('.remove').forEach(btn => {
    btn.addEventListener('click', ev => {
      ev.stopPropagation();
      learned = learned.filter(k => k !== btn.dataset.remove);
      persist();
      syncSaveBtn();
      renderSaved();
    });
  });

  el('clearBtn').addEventListener('click', () => {
    if (!confirm(`Remove all ${entries.length} saved items?`)) return;
    learned = [];
    persist();
    syncSaveBtn();
    renderSaved();
  });
}

/* =====================================================================
   TABS
   ===================================================================== */

function switchTab(name){
  document.querySelectorAll('.tab').forEach(t =>
    t.classList.toggle('active', t.dataset.tab === name)
  );
  el('indicator').style.transform = name === 'learn' ? 'translateX(0)' : 'translateX(100%)';
  el('panel-learn').classList.toggle('hidden', name !== 'learn');
  el('panel-saved').classList.toggle('hidden', name !== 'saved');
  if (name !== 'learn') TTS.stop();
}

/* =====================================================================
   EVENTS
   ===================================================================== */

el('nextBtn').addEventListener('click', nextWord);
el('prevBtn').addEventListener('click', prevWord);
el('saveBtn').addEventListener('click', toggleSave);
el('speakBtn').addEventListener('click', () => TTS.speak(currentItem().h, el('speakBtn')));
el('hanzi').addEventListener('click', () => TTS.speak(currentItem().h, el('speakBtn')));

el('autoChip').addEventListener('click', () => {
  TTS.setAuto(!TTS.isAuto());
  if (TTS.isAuto()) TTS.speak(currentItem().h, el('speakBtn'));
});

el('romajiChip').addEventListener('click', () => {
  showRomaji = !showRomaji;
  try { localStorage.setItem(ROMAJI_KEY, showRomaji ? '1' : '0'); } catch(e){}
  syncRomajiChip();
  renderSaved();
});

document.querySelectorAll('.tab').forEach(t =>
  t.addEventListener('click', () => switchTab(t.dataset.tab))
);

document.querySelectorAll('.mode-chip').forEach(c =>
  c.addEventListener('click', () => setMode(c.dataset.mode))
);

document.querySelectorAll('.filter').forEach(f =>
  f.addEventListener('click', () => { savedFilter = f.dataset.filter; renderSaved(); })
);

document.addEventListener('keydown', e => {
  if (e.target.matches('input, textarea')) return;
  if (el('panel-learn').classList.contains('hidden')) return;

  if (e.key === 'ArrowRight'){ e.preventDefault(); nextWord(); }
  if (e.key === 'ArrowLeft'){  e.preventDefault(); prevWord(); }
  if (e.key.toLowerCase() === 's'){ e.preventDefault(); toggleSave(); }
  if (e.key === ' '){ e.preventDefault(); TTS.speak(currentItem().h, el('speakBtn')); }
  if (e.key.toLowerCase() === 'r'){ e.preventDefault(); el('romajiChip').click(); }
});

window.addEventListener('beforeunload', () => TTS.stop());

/* =====================================================================
   INIT
   ===================================================================== */

el('nWords').textContent = DATA.words.length;
el('nExpr').textContent  = DATA.expressions.length;
el('totalCount').textContent = DATA.words.length;

el('autoChip').classList.toggle('on', TTS.isAuto());

renderCatBar();
renderCard(false);
renderSaved();

if (TTS.isAuto()) setTimeout(() => TTS.speak(currentItem().h, el('speakBtn')), 400);
</script>
</body>
</html>
